name: KSD Nachrichten automatisch aktualisieren

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ksd-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nachrichten abrufen
        run: python scripts/update_news.py
      - name: Aktualisierte Nachrichten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatische KSD Nachrichtenaktualisierung"
            git push
          fi
