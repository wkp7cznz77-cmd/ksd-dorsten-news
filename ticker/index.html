<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSD Dorsten Ticker</title><style>:root{--h:32px}*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100vh;background:transparent!important;overflow:hidden;font-family:Arial,Helvetica,sans-serif}.bar{position:fixed;left:0;right:0;height:var(--h);display:flex;align-items:center;overflow:hidden;white-space:nowrap;color:#fff;z-index:6000}.local{bottom:96px;background:#202020;border-top:2px solid #2f7d32}.breaking{bottom:64px;background:#222;border-top:2px solid #c60000}.weather{bottom:32px;background:#00334f;border-top:1px solid #0066b3}.clock{bottom:0;background:#111;border-top:1px solid #444;justify-content:flex-end;padding:0 14px;font-size:17px;font-weight:bold}.date{font-size:12px;font-weight:normal;margin-right:12px}.label{width:130px;min-width:130px;max-width:130px;flex:0 0 130px;height:32px;padding:7px 5px;font-size:11px;line-height:18px;font-weight:bold;text-transform:uppercase;overflow:hidden;z-index:2}.local .label{background:#2f7d32}.breaking .label{background:#c60000}.weather .label{background:#0066b3}.viewport{flex:1;min-width:0;overflow:hidden}.ticker{display:flex;width:max-content;padding:7px 12px;line-height:18px;font-size:14px;will-change:transform}.ticker span{margin-right:60px}.local .ticker{animation:move 240s linear infinite}.breaking .ticker,.weather .ticker{animation:move 90s linear infinite}@keyframes move{from{transform:translateX(0)}to{transform:translateX(-50%)}}</style></head><body><div class="bar local"><span class="label">Dorsten Lokal</span><div class="viewport"><div class="ticker" id="localTicker"></div></div></div><div class="bar breaking"><span class="label">Breaking News</span><div class="viewport"><div class="ticker" id="breakingTicker"></div></div></div><div class="bar weather"><span class="label">Wetter Dorsten</span><div class="viewport"><div class="ticker" id="weatherTicker"></div></div></div><div class="bar clock"><span class="date" id="date"></span><span id="clock">--:--:--</span></div><script>const localItems=['Neue Flächen für Windenergie: Die Stadt Dorsten will bei weiteren Flächen zunächst auf die Bremse drücken.','Gas-Umstellung in Dorsten: Westnetz startet Vorbereitungen für rund 22.000 Haushalte.','RWW plant in Dorsten eine rund 18 Kilometer lange Wasserleitung.','Schulanmeldungen 2027: Dorstener Grundschulen nehmen Anmeldungen bis 15. November entgegen.','Feldmark und Lembeck: Der Kommunale Ordnungsdienst führt Schwerpunktstreifen durch.','Tempo-Kontrollen: Die Stadt kontrolliert verstärkt im Dorstener Stadtgebiet.','Interkulturelle Woche: Dorsten lädt zum Entdecken, Mitmachen und Begegnen ein.','Herbst- und Familienfest: In der Dorstener Altstadt wird gefeiert.','Brücke Kippheide: Die neue Fuß- und Radwegbrücke zwischen Lembeck und Wulfen ist eröffnet.'];const fallbackBreaking=['USA/CHINA · Trump empfängt Chinas Staatschef Xi in Washington.','ISRAEL · Bei Netanjahus Rede vor den Vereinten Nationen verlassen zahlreiche Diplomaten den Saal.','EU/RUSSLAND · EU plant nach Putin-Einladung keinen Boykott des G20-Gipfels.','ÄTHIOPIEN · Im Norden Äthiopiens eskalieren erneut Kämpfe in der Tigray-Region.'];const weatherItems=['Heute in Dorsten: 17°C, meist bewölkt, kaum Regen.','Morgen: 18–20°C, zeitweise Sonne, einzelne Wolkenfelder.','Übermorgen: 16–18°C, leicht wechselhaft, kurze Schauer möglich.','Wind: schwach bis mäßig, überwiegend aus westlichen Richtungen.'];function fill(id,items){const clean=[...new Set(items.map(x=>String(x).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim()).filter(Boolean))].slice(0,12);const one=clean.map(x=>'<span>'+x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>').join('');document.getElementById(id).innerHTML=one+one}function region(t){const s=t.toLowerCase();if(/trump|usa|washington|amerikan/.test(s)&&/xi|china|peking/.test(s))return'USA/CHINA';if(/trump|usa|washington|amerikan/.test(s))return'USA';if(/china|xi|peking/.test(s))return'CHINA';if(/ukrain|selenskyj|kiew/.test(s)&&/russ|putin|moskau/.test(s))return'UKRAINE/RUSSLAND';if(/ukrain|selenskyj|kiew/.test(s))return'UKRAINE';if(/russ|putin|moskau/.test(s))return'RUSSLAND';if(/israel|netanjahu|gaza|hamas/.test(s))return'ISRAEL/GAZA';if(/iran|teheran/.test(s))return'IRAN';if(/saudi/.test(s))return'SAUDI-ARABIEN';if(/frankreich|macron|paris/.test(s))return'FRANKREICH';if(/äthiop|tigray/.test(s))return'ÄTHIOPIEN';if(/indones/.test(s))return'INDONESIEN';return'INTERNATIONAL'}fill('localTicker',localItems);fill('breakingTicker',fallbackBreaking);fill('weatherTicker',weatherItems);async function refreshBreaking(){try{const r=await fetch('https://www.tagesschau.de/api2u/news/?ressort=ausland&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const j=await r.json();const a=(j.news||[]).filter(n=>n&&n.title).slice(0,12).map(n=>region(n.title)+' · '+n.title);if(a.length)fill('breakingTicker',a)}catch(e){}}refreshBreaking();setInterval(refreshBreaking,300000);function tick(){const n=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(n)+' Uhr';document.getElementById('date').textContent=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).format(n)}tick();setInterval(tick,1000);</script></body></html>
