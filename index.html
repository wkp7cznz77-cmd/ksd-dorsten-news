<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSD Dorsten News</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}.bar{position:fixed;left:0;width:100%;height:108px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;color:#fff;background:#222}.local{bottom:324px;border-top:7px solid #2f7d32}.breaking{bottom:216px;border-top:7px solid #c60000}.weather{bottom:108px;background:#00334f;border-top:6px solid #0066b3}.clockbar{position:fixed;left:0;bottom:0;width:100%;height:108px;display:flex;align-items:center;justify-content:flex-end;padding:0 28px;background:#111;color:#fff;border-top:5px solid #444;font-size:54px;font-weight:bold;letter-spacing:2px}.clockdate{font-size:36px;font-weight:normal;margin-right:30px;letter-spacing:0}.label{width:390px;min-width:390px;height:108px;padding:25px 14px;font-size:33px;line-height:50px;font-weight:bold;text-transform:uppercase;z-index:2}.local .label{background:#2f7d32}.breaking .label{background:#c60000}.weather .label{background:#0066b3}.viewport{flex:1;min-width:0;overflow:hidden}.ticker{display:flex;width:max-content;padding:24px 28px;line-height:52px;font-size:48px;font-weight:600;will-change:transform}.ticker span{margin-right:180px}.local .ticker{animation:move 240s linear infinite}.breaking .ticker,.weather .ticker{animation:move 90s linear infinite}@keyframes move{from{transform:translateX(0)}to{transform:translateX(-50%)}}</style></head><body><div class="bar local"><div class="label">Dorsten Lokal</div><div class="viewport"><div class="ticker" id="local"></div></div></div><div class="bar breaking"><div class="label">Breaking News</div><div class="viewport"><div class="ticker" id="breaking"></div></div></div><div class="bar weather"><div class="label">Wetter Dorsten</div><div class="viewport"><div class="ticker" id="weather"></div></div></div><div class="clockbar"><span class="clockdate" id="date"></span><span id="clock">--:--:--</span></div><script>
const localItems=['Neue Flächen für Windenergie: Die Stadt Dorsten will bei weiteren Flächen zunächst auf die Bremse drücken.','Gas-Umstellung in Dorsten: Westnetz startet Vorbereitungen für rund 22.000 Haushalte.','Großprojekt in Dorsten: RWW plant eine rund 18 Kilometer lange Wasserleitung.','Schulanmeldungen 2027: Dorstener Grundschulen nehmen Anmeldungen bis 15. November entgegen.','Feldmark und Lembeck: Der Kommunale Ordnungsdienst führt in der kommenden Woche Schwerpunktstreifen durch.','Tempo-Kontrollen: Vom 28. September bis 4. Oktober kontrolliert die Stadt verstärkt im Dorstener Stadtgebiet.','Interkulturelle Woche: Dorsten lädt zum Entdecken, Mitmachen und Begegnen ein.','Herbst- und Familienfest: Am Wochenende wird in der Dorstener Altstadt gefeiert.','Brücke Kippheide: Die neue Fuß- und Radwegbrücke zwischen Lembeck und Wulfen ist eröffnet.'];
const fallbackBreaking=['USA/CHINA · Trump empfängt Chinas Staatschef Xi in Washington.','ISRAEL/UN · Bei Netanjahus Rede vor den Vereinten Nationen verlassen zahlreiche Diplomaten den Saal.','EU/RUSSLAND · EU plant nach Putin-Einladung keinen G20-Boykott.','ÄTHIOPIEN · Im Norden des Landes eskalieren erneut Kämpfe in der Tigray-Region.'];
const weatherItems=['Heute in Dorsten: 17°C, meist bewölkt, kaum Regen.','Morgen: 18–20°C, zeitweise Sonne, einzelne Wolkenfelder.','Übermorgen: 16–18°C, leicht wechselhaft, kurze Schauer möglich.','Wind: schwach bis mäßig, überwiegend aus westlichen Richtungen.'];
function fill(id,items){if(!items||!items.length)return;const clean=[...new Set(items.map(x=>String(x).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim()).filter(Boolean))].slice(0,12);const one=clean.map(x=>'<span>'+x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>').join('');document.getElementById(id).innerHTML=one+one}
function countryPrefix(n){const s=((n.title||'')+' '+(n.topline||'')+' '+(n.firstSentence||'')).toLowerCase();const rules=[['UKRAINE',/ukrain|kiew|kyiv|selensky/],['RUSSLAND',/russland|moskau|putin|kreml/],['USA',/\busa\b|\bus-\b|trump|weißes haus|washington|cnn/],['CHINA',/china|xi jinping|peking/],['ISRAEL',/israel|netanjahu|jerusalem|gaza/],['IRAN',/iran|teheran/],['SAUDI-ARABIEN',/saudi|riad|mekka/],['TÜRKEI',/türkei|türkisch|ankara|erdogan/],['FRANKREICH',/frankreich|französ|macron|paris/],['DEUTSCHLAND',/deutschland|bundesregierung|berlin|wadephul/],['POLEN',/polen|polnisch|warschau|tusk/],['INDONESIEN',/indonesien|sumatra|borneo/],['ÄTHIOPIEN',/äthiop|tigray/],['SYRIEN',/syrien|damaskus/],['JAPAN',/japan|tokio/],['SPANIEN',/spanien|spanisch|madrid/],['ITALIEN',/italien|rom/],['EU',/\beu\b|europäische union|brüssel/],['UN',/vereinte nationen|un-sicherheitsrat|un-general/]];const found=[];for(const [name,re] of rules){if(re.test(s)&&!found.includes(name))found.push(name);if(found.length===2)break}return found.length?found.join('/'):'INTERNATIONAL'}
fill('local',localItems);fill('breaking',fallbackBreaking);fill('weather',weatherItems);async function refreshBreaking(){try{const r=await fetch('https://www.tagesschau.de/api2u/news/?ressort=ausland&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const j=await r.json();const items=(j.news||[]).filter(n=>n&&n.title).slice(0,12).map(n=>countryPrefix(n)+' · '+n.title);if(items.length)fill('breaking',items)}catch(e){}}refreshBreaking();setInterval(refreshBreaking,300000);function updateClock(){const n=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(n)+' Uhr';document.getElementById('date').textContent=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).format(n)}updateClock();setInterval(updateClock,1000);</script></body></html>
