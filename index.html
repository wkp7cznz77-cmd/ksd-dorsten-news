<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSD Dorsten News</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}.bar{position:fixed;left:0;width:100%;height:32px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;color:#fff;background:#222;box-sizing:border-box}.local{bottom:64px;border-top:2px solid #2f7d32}.breaking{bottom:32px;border-top:2px solid #c60000}.weather{bottom:0;background:#00334f;border-top:1px solid #0066b3}.label{width:130px;min-width:130px;height:32px;box-sizing:border-box;padding:7px 5px;font-size:11px;line-height:18px;font-weight:bold;text-transform:uppercase;z-index:2}.local .label{background:#2f7d32}.breaking .label{background:#c60000}.weather .label{background:#0066b3}.viewport{flex:1;min-width:0;overflow:hidden}.ticker{display:flex;width:max-content;padding:7px 12px;line-height:18px;font-size:14px;will-change:transform}.ticker span{margin-right:60px}.local .ticker{animation:move 240s linear infinite}.breaking .ticker,.weather .ticker{animation:move 90s linear infinite}@keyframes move{from{transform:translateX(0)}to{transform:translateX(-50%)}}</style></head><body><div class="bar local"><div class="label">Dorsten Lokal</div><div class="viewport"><div class="ticker" id="local"></div></div></div><div class="bar breaking"><div class="label">Breaking News</div><div class="viewport"><div class="ticker" id="breaking"></div></div></div><div class="bar weather"><div class="label">Wetter Dorsten</div><div class="viewport"><div class="ticker" id="weather"></div></div></div><script>const localItems=['Politik – Stadtrat berät über Haushaltsplanung: Im Fokus stehen Investitionen in Schulen, Infrastruktur und Digitalisierung der Verwaltung.','Politik – Bürgerbeteiligung zur Innenstadtentwicklung: Themen sind Aufenthaltsqualität, Verkehrsführung und neue Grünflächen.','Wirtschaft – Dorstener Einzelhandel setzt auf Digital-Offensive: Geschäfte bauen ihre Online-Angebote aus.','Verkehr – Sanierung wichtiger Kreuzung: Während der Arbeiten kann es zu Umleitungen und längeren Fahrzeiten kommen.','Verkehr – Mehr Radwege zwischen Stadtteilen geplant: Ziel ist ein sicherer und durchgängiger Radverkehr.','Sport – Lokalderby am Wochenende: Regionale Teams treffen aufeinander.','Kultur – Veranstaltungen und Angebote in Dorsten im Blick.','Polizei – Hinweise zu Prävention und Verkehrssicherheit.','Bildung – Schulen und digitale Ausstattung im Fokus.','Soziales – Neue Begegnungs- und Beratungsangebote in den Stadtteilen.'];const breakingItems=['Internationale Nachrichten und wichtige Entwicklungen aus aller Welt.','Europa: Aktuelle Meldungen aus Politik, Wirtschaft und Gesellschaft.','Amerika: Nachrichten aus Nord- und Südamerika.','Asien: Aktuelle Entwicklungen aus Asien und dem Pazifikraum.','Nahost & Afrika: Wichtige Meldungen und internationale Entwicklungen.','Wirtschaft: Märkte, Unternehmen und globale Konjunktur im Blick.'];const weatherItems=['Heute in Dorsten: 17°C, meist bewölkt, kaum Regen.','Morgen: 18–20°C, zeitweise Sonne, einzelne Wolkenfelder.','Übermorgen: 16–18°C, leicht wechselhaft, kurze Schauer möglich.','Wind: schwach bis mäßig, überwiegend aus westlichen Richtungen.'];function fill(id,items){const one=items.map(x=>'<span>'+x+'</span>').join('');document.getElementById(id).innerHTML=one+one}fill('local',localItems);fill('breaking',breakingItems);fill('weather',weatherItems);</script></body></html>
