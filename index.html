<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSD Dorsten News</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}.bar{position:fixed;left:0;width:100%;height:32px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;color:#fff;background:#222;box-sizing:border-box}.local{bottom:96px;border-top:2px solid #2f7d32}.breaking{bottom:64px;border-top:2px solid #c60000}.weather{bottom:32px;background:#00334f;border-top:1px solid #0066b3}.clockbar{position:fixed;left:0;bottom:0;width:100%;height:32px;display:flex;align-items:center;justify-content:flex-end;box-sizing:border-box;padding:0 14px;background:#111;color:#fff;border-top:1px solid #444;font-size:18px;font-weight:bold;letter-spacing:1px}.clockdate{font-size:12px;font-weight:normal;margin-right:12px;letter-spacing:0}.label{width:130px;min-width:130px;height:32px;box-sizing:border-box;padding:7px 5px;font-size:11px;line-height:18px;font-weight:bold;text-transform:uppercase;z-index:2}.local .label{background:#2f7d32}.breaking .label{background:#c60000}.weather .label{background:#0066b3}.viewport{flex:1;min-width:0;overflow:hidden}.ticker{display:flex;width:max-content;padding:7px 12px;line-height:18px;font-size:14px;will-change:transform}.ticker span{margin-right:60px}.local .ticker{animation:move 150s linear infinite}.breaking .ticker,.weather .ticker{animation:move 90s linear infinite}@keyframes move{from{transform:translateX(0)}to{transform:translateX(-50%)}}</style></head><body><div class="bar local"><div class="label">Dorsten Lokal</div><div class="viewport"><div class="ticker" id="local"></div></div></div><div class="bar breaking"><div class="label">Breaking News</div><div class="viewport"><div class="ticker" id="breaking"></div></div></div><div class="bar weather"><div class="label">Wetter Dorsten</div><div class="viewport"><div class="ticker" id="weather"></div></div></div><div class="clockbar"><span class="clockdate" id="date"></span><span id="clock">--:--:--</span></div><script>
const fallbackLocal=['Neue Flächen für Windenergie: Stadt Dorsten will bei weiteren Flächen zunächst auf die Bremse drücken.','Das könnte das nächste Stadterneuerungsprojekt in Dorsten werden.','RWW plant eine rund 18 Kilometer lange Wasserleitung in Dorsten.'];
const fallbackBreaking=['Xi Jinping bei Donald Trump: Fanfaren, Spalier, Bankett - aber kaum Lösungen.','Macron will Saudi-Arabien beim Schutz eines Ölhafens militärisch unterstützen.','Griechisch-türkische Spannungen in der Ägäis nehmen zu.'];
const weatherItems=['Heute in Dorsten: 17°C, meist bewölkt, kaum Regen.','Morgen: 18–20°C, zeitweise Sonne, einzelne Wolkenfelder.','Übermorgen: 16–18°C, leicht wechselhaft, kurze Schauer möglich.','Wind: schwach bis mäßig, überwiegend aus westlichen Richtungen.'];
function fill(id,items){if(!items||!items.length)return;const clean=[...new Set(items.map(x=>String(x).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim()).filter(Boolean))].slice(0,12);const one=clean.map(x=>'<span>'+x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>').join('');document.getElementById(id).innerHTML=one+one}
fill('local',fallbackLocal);fill('breaking',fallbackBreaking);fill('weather',weatherItems);
async function refreshNews(){try{const r=await fetch('news.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.local&&j.local.length)fill('local',j.local);if(j.breaking&&j.breaking.length)fill('breaking',j.breaking)}catch(e){console.warn('news.json nicht erreichbar; Fallback bleibt sichtbar.',e)}}
refreshNews();setInterval(refreshNews,300000);
function updateClock(){const n=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(n)+' Uhr';document.getElementById('date').textContent=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).format(n)}updateClock();setInterval(updateClock,1000);
</script></body></html>
