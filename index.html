<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSD Dorsten News</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}.bar{position:fixed;left:0;width:100%;height:32px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;color:#fff;background:#222;box-sizing:border-box}.local{bottom:96px;border-top:2px solid #2f7d32}.breaking{bottom:64px;border-top:2px solid #c60000}.weather{bottom:32px;background:#00334f;border-top:1px solid #0066b3}.clockbar{position:fixed;left:0;bottom:0;width:100%;height:32px;display:flex;align-items:center;justify-content:flex-end;box-sizing:border-box;padding:0 14px;background:#111;color:#fff;border-top:1px solid #444;font-size:18px;font-weight:bold;letter-spacing:1px}.clockdate{font-size:12px;font-weight:normal;margin-right:12px;letter-spacing:0}.label{width:130px;min-width:130px;height:32px;box-sizing:border-box;padding:7px 5px;font-size:11px;line-height:18px;font-weight:bold;text-transform:uppercase;z-index:2}.local .label{background:#2f7d32}.breaking .label{background:#c60000}.weather .label{background:#0066b3}.viewport{flex:1;min-width:0;overflow:hidden}.ticker{display:flex;width:max-content;padding:7px 12px;line-height:18px;font-size:14px;will-change:transform}.ticker span{margin-right:60px}.local .ticker{animation:move 240s linear infinite}.breaking .ticker,.weather .ticker{animation:move 90s linear infinite}@keyframes move{from{transform:translateX(0)}to{transform:translateX(-50%)}}</style></head><body><div class="bar local"><div class="label">Dorsten Lokal</div><div class="viewport"><div class="ticker" id="local"></div></div></div><div class="bar breaking"><div class="label">Breaking News</div><div class="viewport"><div class="ticker" id="breaking"></div></div></div><div class="bar weather"><div class="label">Wetter Dorsten</div><div class="viewport"><div class="ticker" id="weather"></div></div></div><div class="clockbar"><span class="clockdate" id="date"></span><span id="clock">--:--:--</span></div><script>
const fallbackLocal=['Dorsten: Aktuelle lokale Meldungen werden geladen.'];
const fallbackBreaking=['Macron will Saudi-Arabien beim Schutz eines Ölhafens militärisch unterstützen.','Trump empfängt Chinas Staatschef Xi in Washington.','Bei Netanjahus Rede vor den Vereinten Nationen verlassen zahlreiche Diplomaten den Saal.','EU plant nach Putin-Einladung keinen Boykott des G20-Gipfels.','Im Norden Äthiopiens eskalieren erneut Kämpfe in der Tigray-Region.'];
const weatherItems=['Heute in Dorsten: 17°C, meist bewölkt, kaum Regen.','Morgen: 18–20°C, zeitweise Sonne, einzelne Wolkenfelder.','Übermorgen: 16–18°C, leicht wechselhaft, kurze Schauer möglich.','Wind: schwach bis mäßig, überwiegend aus westlichen Richtungen.'];
function fill(id,items){if(!items||!items.length)return;const clean=[...new Set(items.map(x=>String(x).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim()).filter(Boolean))].slice(0,12);const one=clean.map(x=>'<span>'+x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>').join('');document.getElementById(id).innerHTML=one+one}
fill('local',fallbackLocal);fill('breaking',fallbackBreaking);fill('weather',weatherItems);
async function refreshBreaking(){try{const r=await fetch('https://www.tagesschau.de/api2u/news/?ressort=ausland&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const items=(j.news||[]).filter(n=>n&&n.title).slice(0,12).map(n=>n.title+' · Quelle: tagesschau.de');if(items.length)fill('breaking',items)}catch(e){console.warn('Tagesschau API nicht erreichbar; aktuelle Fallback-Schlagzeilen bleiben sichtbar.',e)}}
async function rss(url){const api='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url)+'&_='+Date.now();const r=await fetch(api,{cache:'no-store'});if(!r.ok)throw new Error('feed');const j=await r.json();if(j.status!=='ok'||!j.items)throw new Error('feed');return j.items.map(i=>i.title).filter(Boolean)}
async function refreshLocal(){try{const items=await rss('https://rssamplifier.com/dorstenerzeitung-de.rss');const dorsten=items.filter(x=>/dorsten|wulfen|rhade|hervest|holsterhausen|lembeck|deuten|altendorf|hardt/i.test(x));if((dorsten.length?dorsten:items).length)fill('local',(dorsten.length?dorsten:items).map(x=>x+' · Quelle: Dorstener Zeitung'))}catch(e){console.warn('Dorsten-Feed nicht erreichbar',e)}}
function refreshNews(){refreshBreaking();refreshLocal()}
refreshNews();setInterval(refreshNews,300000);
function updateClock(){const n=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(n)+' Uhr';document.getElementById('date').textContent=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).format(n)}updateClock();setInterval(updateClock,1000);
</script></body></html>
