<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSD Dorsten News</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}.bar{position:fixed;left:0;width:100%;height:32px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;color:#fff;background:#222;box-sizing:border-box}.local{bottom:96px;border-top:2px solid #2f7d32}.breaking{bottom:64px;border-top:2px solid #c60000}.weather{bottom:32px;background:#00334f;border-top:1px solid #0066b3}.clockbar{position:fixed;left:0;bottom:0;width:100%;height:32px;display:flex;align-items:center;justify-content:flex-end;box-sizing:border-box;padding:0 14px;background:#111;color:#fff;border-top:1px solid #444;font-size:18px;font-weight:bold;letter-spacing:1px}.clockdate{font-size:12px;font-weight:normal;margin-right:12px;letter-spacing:0}.label{width:130px;min-width:130px;height:32px;box-sizing:border-box;padding:7px 5px;font-size:11px;line-height:18px;font-weight:bold;text-transform:uppercase;z-index:2}.local .label{background:#2f7d32}.breaking .label{background:#c60000}.weather .label{background:#0066b3}.viewport{flex:1;min-width:0;overflow:hidden}.ticker{display:flex;width:max-content;padding:7px 12px;line-height:18px;font-size:14px;will-change:transform}.ticker span{margin-right:60px}.local .ticker{animation:move 75s linear infinite}.breaking .ticker,.weather .ticker{animation:move 90s linear infinite}@keyframes move{from{transform:translateX(0)}to{transform:translateX(-50%)}}</style></head><body><div class="bar local"><div class="label">Dorsten Lokal</div><div class="viewport"><div class="ticker" id="local"></div></div></div><div class="bar breaking"><div class="label">Breaking News</div><div class="viewport"><div class="ticker" id="breaking"></div></div></div><div class="bar weather"><div class="label">Wetter Dorsten</div><div class="viewport"><div class="ticker" id="weather"></div></div></div><div class="clockbar"><span class="clockdate" id="date"></span><span id="clock">--:--:--</span></div><script>
const fallbackLocal=['Neue Flächen für Windenergie: Stadt Dorsten will bei weiteren Flächen zunächst auf die Bremse drücken.','Das könnte das nächste Stadterneuerungsprojekt in Dorsten werden.','RWW plant eine rund 18 Kilometer lange Wasserleitung in Dorsten.'];
const fallbackBreaking=['Xi Jinping bei Donald Trump: Fanfaren, Spalier, Bankett - aber kaum Lösungen.','Macron will Saudi-Arabien beim Schutz eines Ölhafens militärisch unterstützen.','Griechisch-türkische Spannungen in der Ägäis nehmen zu.'];
const fallbackWeather=['Wetterdaten werden aktualisiert …'];
function fill(id,items){if(!items||!items.length)return;const clean=[...new Set(items.map(x=>String(x).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim()).filter(Boolean))].slice(0,12);const one=clean.map(x=>'<span>'+x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>').join('');document.getElementById(id).innerHTML=one+one}
fill('local',fallbackLocal);fill('breaking',fallbackBreaking);fill('weather',fallbackWeather);
async function refreshNews(){try{const r=await fetch('news.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.local&&j.local.length)fill('local',j.local);if(j.breaking&&j.breaking.length)fill('breaking',j.breaking)}catch(e){console.warn('news.json nicht erreichbar; Fallback bleibt sichtbar.',e)}}
function weatherText(code){if(code===0)return'klar';if(code<=3)return'leicht bis stark bewölkt';if(code===45||code===48)return'neblig';if(code>=51&&code<=57)return'Nieselregen';if(code>=61&&code<=67)return'Regen';if(code>=71&&code<=77)return'Schnee';if(code>=80&&code<=82)return'Regenschauer';if(code>=85&&code<=86)return'Schneeschauer';if(code>=95)return'Gewitter möglich';return'wechselhaft'}
async function refreshWeather(){try{const u='https://api.open-meteo.com/v1/forecast?latitude=51.66&longitude=6.97&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=3&_='+Date.now();const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const c=j.current||{},d=j.daily||{};const items=[];if(c.temperature_2m!=null)items.push('Aktuell in Dorsten: '+Math.round(c.temperature_2m)+'°C, '+weatherText(c.weather_code)+', gefühlt '+Math.round(c.apparent_temperature)+'°C, Wind '+Math.round(c.wind_speed_10m)+' km/h.');const names=['Heute','Morgen','Übermorgen'];for(let i=0;i<Math.min(3,(d.time||[]).length);i++){items.push(names[i]+': '+Math.round(d.temperature_2m_min[i])+'–'+Math.round(d.temperature_2m_max[i])+'°C, '+weatherText(d.weather_code[i])+', Regenrisiko bis '+Math.round(d.precipitation_probability_max[i]||0)+' %.')}if(items.length)fill('weather',items)}catch(e){console.warn('Live-Wetter nicht erreichbar.',e)}}
refreshNews();setInterval(refreshNews,300000);refreshWeather();setInterval(refreshWeather,900000);
function updateClock(){const n=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(n)+' Uhr';document.getElementById('date').textContent=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).format(n)}updateClock();setInterval(updateClock,1000);
</script></body></html>
